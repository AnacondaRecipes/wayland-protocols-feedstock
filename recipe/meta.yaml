{% set name = "wayland-protocols" %}
{% set version = "1.47" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://gitlab.freedesktop.org/wayland/{{ name }}/-/archive/{{ version }}/{{ name }}-{{ version }}.tar.bz2
  sha256: d725e99a5cec5393911d72975c432b0230a030a2675cfa7566f1708cabe75ca4

build:
  skip: true  # [not linux]
  number: 0

requirements:
  build:
    - meson
    - ninja-base
    - pkg-config
  host:
    - wayland

test:
  requires:
    - pkg-config
  commands:
    # check that the .pc file is installed correctly
    - pkg-config --exists wayland-protocols
    # check that a protocol can be found from path retrieved from pkg-config
    - test -f `pkg-config --variable=pkgdatadir --dont-define-prefix wayland-protocols`/stable/xdg-shell/xdg-shell.xml

about:
  home: https://gitlab.freedesktop.org/wayland/wayland-protocols
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: Protocol files for the Wayland rendering architecture
  description: |
    wayland-protocols contains Wayland protocols that add functionality not
    available in the Wayland core protocol. Such protocols either add
    completely new functionality, or extend the functionality of some other
    protocol either in Wayland core, or some other protocol in
    wayland-protocols.

    A protocol in wayland-protocols consists of a directory containing a set
    of XML files containing the protocol specification, and a README file
    containing detailed state and a list of maintainers.
  dev_url: https://gitlab.freedesktop.org/wayland/wayland-protocols
  doc_url: https://gitlab.freedesktop.org/wayland/wayland-protocols

extra:
  recipe-maintainers:
    - ryanvolz
